<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>비밀번호 재설정 · 교과서 제작 스튜디오</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <p class="eyebrow">TEXTBOOK STUDIO</p>
      <h1>새 비밀번호 설정</h1>
      <p class="login-description">앞으로 사용할 8자 이상의 새 비밀번호를 입력해 주세요.</p>
      <form id="resetPasswordForm">
        <label for="newPassword">새 비밀번호</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required />
        <label for="confirmPassword">새 비밀번호 확인</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
        <button class="primary-button" type="submit">비밀번호 변경</button>
      </form>
      <p class="login-message" id="resetMessage" role="status"></p>
    </main>
    <script src="/reset-password.js"></script>
  </body>
</html>
