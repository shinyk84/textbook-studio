<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>편집자 관리 · 교과서 제작 스튜디오</title>
    <link rel="stylesheet" href="/styles.css?v=3" />
    <link rel="stylesheet" href="/editors.css" />
  </head>
  <body class="editors-page">
    <main class="editors-shell">
      <header>
        <div>
          <p class="eyebrow">PROJECT ACCESS</p>
          <h1>편집자 관리</h1>
          <p class="subtitle">공동 편집을 허용할 이메일을 먼저 등록합니다.</p>
        </div>
        <div class="header-actions">
          <button class="secondary-button" type="button" onclick="location.href='/'">프로젝트로 돌아가기</button>
          <button class="secondary-button" id="signOutButton" type="button">로그아웃</button>
        </div>
      </header>

      <section class="editor-panel">
        <h2>편집자 추가</h2>
        <p>등록된 편집자는 같은 이메일로 ‘최초 계정 만들기’를 한 뒤 프로젝트에 접속할 수 있습니다.</p>
        <form id="editorForm">
          <input id="editorEmail" type="email" placeholder="editor@example.com" required />
          <button class="primary-button" type="submit">접근 허용</button>
        </form>
        <p id="editorMessage" role="status"></p>
      </section>

      <section class="editor-panel">
        <div class="panel-heading">
          <h2>등록된 사용자</h2>
          <span id="editorCount">0명</span>
        </div>
        <div id="editorList"></div>
      </section>
    </main>
    <script src="/auth-client.js"></script>
    <script src="/editors.js"></script>
  </body>
</html>
